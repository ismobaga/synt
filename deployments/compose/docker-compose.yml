services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: synt
      POSTGRES_PASSWORD: synt
      POSTGRES_DB: synt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U synt" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_DISABLE_POSTFIX: "True"
      # PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "synt.local"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://synt:synt@postgres:5432/synt?sslmode=disable
      REDIS_ADDR: redis:6379
      ADDR: :8080
      JWT_SECRET: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  tts-local:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.tts
    environment:
      LOCAL_TTS_BACKEND: ${LOCAL_TTS_BACKEND:-espeak}
      LOCAL_TTS_COMMAND: ${LOCAL_TTS_COMMAND:-espeak}
      LOCAL_TTS_DEFAULT_VOICE: ${LOCAL_TTS_DEFAULT_VOICE:-Jasper}
      LOCAL_TTS_DEFAULT_MODEL: ${LOCAL_TTS_DEFAULT_MODEL:-KittenML/kitten-tts-mini-0.8}
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN:-}
      HF_TOKEN: ${HUGGINGFACE_API_TOKEN:-}
      HUGGINGFACE_HUB_TOKEN: ${HUGGINGFACE_API_TOKEN:-}
      LOCAL_TTS_OUTPUT_DIR: /tmp/tts-local
    ports:
      - "8010:8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://synt:synt@postgres:5432/synt?sslmode=disable
      REDIS_ADDR: redis:6379
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ${MINIO_BUCKET:-synt-assets}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      TTS_PROVIDER: ${TTS_PROVIDER:-auto}
      TTS_OUTPUT_DIR: ${TTS_OUTPUT_DIR:-/tmp/synt/tts}
      KITTEN_TTS_BASE_URL: ${KITTEN_TTS_BASE_URL:-http://tts-local:8000}
      KITTEN_TTS_MODEL: ${KITTEN_TTS_MODEL:-KittenML/kitten-tts-mini-0.8}
      KITTEN_TTS_API_KEY: ${KITTEN_TTS_API_KEY:-}
      KITTEN_TTS_VOICE: ${KITTEN_TTS_VOICE:-Jasper}
      CHATTERBOX_TTS_BASE_URL: ${CHATTERBOX_TTS_BASE_URL:-http://tts-local:8000/models}
      CHATTERBOX_TTS_MODEL: ${CHATTERBOX_TTS_MODEL:-resemble-ai/chatterbox}
      CHATTERBOX_TTS_API_KEY: ${CHATTERBOX_TTS_API_KEY:-}
      VIBEVOICE_TTS_BASE_URL: ${VIBEVOICE_TTS_BASE_URL:-http://tts-local:8000/models}
      VIBEVOICE_TTS_MODEL: ${VIBEVOICE_TTS_MODEL:-fishaudio/VibeVoice-Realtime-0.5B}
      VIBEVOICE_TTS_API_KEY: ${VIBEVOICE_TTS_API_KEY:-}
      MICROSOFT_TTS_BASE_URL: ${MICROSOFT_TTS_BASE_URL:-http://tts-local:8000/models}
      MICROSOFT_TTS_MODEL: ${MICROSOFT_TTS_MODEL:-microsoft/speecht5_tts}
      MICROSOFT_TTS_API_KEY: ${MICROSOFT_TTS_API_KEY:-}
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:0.8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      tts-local:
        condition: service_healthy

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  minio_data:
  pgadmin_data:
